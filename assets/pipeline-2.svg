<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="공정 도면 심볼 인식: 심볼 검출, 텍스트 짝짓기, 배관 연결, CAD 원본 추출 순서로 처리. 운영 기본 엔진으로 채택.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
  :root{--ink:#1a1d21;--sub:#5b6168;--line:#d5d9dd;--acc:#1f5f63;--pre:#b8bec4}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e8ea;--sub:#9aa1a8;--line:#3a4046;--acc:#6fb7b4;--pre:#5a6168}}
  .ink{fill:var(--ink)} .sub{fill:var(--sub)} .acc{fill:var(--acc)} .pre{fill:var(--pre)}

  .node{fill:var(--ink)}
  .dot{fill:var(--acc);animation:run 4.5s cubic-bezier(.16,1,.3,1) infinite}
  @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(624px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<text class="ink" x="0" y="20" font-size="16" font-weight="700">공정 도면 심볼 인식</text>
<line x1="8" y1="62" x2="632" y2="62" stroke="var(--line)" stroke-width="1.5"/>
<circle class="node" cx="8" cy="62" r="6"/>
<text class="ink" x="8" y="94" font-size="15" font-weight="600" text-anchor="start">심볼 검출</text>
<circle class="node" cx="216" cy="62" r="6"/>
<text class="ink" x="216" y="94" font-size="15" font-weight="600" text-anchor="middle">텍스트 짝짓기</text>
<circle class="node" cx="424" cy="62" r="6"/>
<text class="ink" x="424" y="94" font-size="15" font-weight="600" text-anchor="middle">배관 연결</text>
<circle class="node" cx="632" cy="62" r="6"/>
<text class="ink" x="632" y="94" font-size="15" font-weight="600" text-anchor="end">CAD 원본 추출</text>
<circle class="dot" cx="8" cy="62" r="5"/>
<text class="sub" x="0" y="130" font-size="14">운영 기본 엔진으로 채택, 검출 모델 mAP50 0.986, 재현율 0.988(내부 검증셋)</text>
</svg>