<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-label="sunlitsoil">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
  :root{--ink:#1a1d21;--sub:#5b6168;--line:#d5d9dd;--acc:#1f5f63;--pre:#b8bec4}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e8ea;--sub:#9aa1a8;--line:#3a4046;--acc:#6fb7b4;--pre:#5a6168}}
  .ink{fill:var(--ink)} .sub{fill:var(--sub)} .acc{fill:var(--acc)} .pre{fill:var(--pre)}

  .sun{fill:var(--acc);animation:rise 2.4s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{transform:translateY(18px)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="sky"><rect x="0" y="0" width="640" height="96"/></clipPath></defs>
<g clip-path="url(#sky)"><circle class="sun" cx="586" cy="96" r="28"/></g>
<line x1="0" y1="96" x2="640" y2="96" stroke="var(--line)" stroke-width="1.5"/>
<text class="ink" x="0" y="64" font-size="44" font-weight="700" letter-spacing="-0.02em">sunlitsoil</text>
</svg>