<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-label="같은 조건에서 바꾸기 전과 후. 노트 검색 R@10 78.2%에서 88.2%, 개인정보 가림 재현율 0.875에서 1.000, 관상네컷 응답 80초에서 40초.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
  :root{--ink:#1a1d21;--sub:#5b6168;--line:#d5d9dd;--acc:#1f5f63;--pre:#b8bec4}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e8ea;--sub:#9aa1a8;--line:#3a4046;--acc:#6fb7b4;--pre:#5a6168}}
  .ink{fill:var(--ink)} .sub{fill:var(--sub)} .acc{fill:var(--acc)} .pre{fill:var(--pre)}

  .bar{transform-box:fill-box;transform-origin:left;animation:ext 1.8s .4s cubic-bezier(.16,1,.3,1) both}
  @keyframes ext{from{transform:scaleX(var(--s))}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text class="ink" x="0" y="18" font-size="16" font-weight="700">같은 조건에서 바꾸기 전과 후</text>
<g transform="translate(0,26)">
<text class="ink" x="0" y="44" font-size="16" font-weight="700">노트 검색</text>
<text class="sub" x="0" y="65" font-size="13">같은 119개 질문, 노트 단위 R@10</text>
<text class="sub" x="0" y="91" font-size="13">전</text>
<rect class="pre" x="28" y="79" width="414.5" height="14" rx="3"/>
<text class="sub" x="450.5" y="91" font-size="14" font-weight="400">78.2%</text>
<text class="sub" x="0" y="115" font-size="13">후</text>
<rect class="acc bar" style="--s:0.887" x="28" y="103" width="467.5" height="14" rx="3"/>
<text class="ink" x="503.5" y="115" font-size="14" font-weight="700">88.2%</text>
<text class="ink" x="0" y="154" font-size="16" font-weight="700">개인정보 가림</text>
<text class="sub" x="0" y="175" font-size="13">같은 22개 사례, 실제 가려진 결과 기준 재현율</text>
<text class="sub" x="0" y="201" font-size="13">전</text>
<rect class="pre" x="28" y="189" width="463.8" height="14" rx="3"/>
<text class="sub" x="499.8" y="201" font-size="14" font-weight="400">0.875</text>
<text class="sub" x="0" y="225" font-size="13">후</text>
<rect class="acc bar" style="--s:0.875" x="28" y="213" width="530.0" height="14" rx="3"/>
<text class="ink" x="566.0" y="225" font-size="14" font-weight="700">1.000</text>
<text class="ink" x="0" y="264" font-size="16" font-weight="700">관상네컷</text>
<text class="sub" x="0" y="285" font-size="13">같은 사진 기준 응답 시간, 짧을수록 좋음</text>
<text class="sub" x="0" y="311" font-size="13">전</text>
<rect class="pre" x="28" y="299" width="530.0" height="14" rx="3"/>
<text class="sub" x="566.0" y="311" font-size="14" font-weight="400">80초</text>
<text class="sub" x="0" y="335" font-size="13">후</text>
<rect class="acc bar" style="--s:2.000" x="28" y="323" width="265.0" height="14" rx="3"/>
<text class="ink" x="301.0" y="335" font-size="14" font-weight="700">40초</text>
</g>
</svg>