<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-label="sunlitsoil. 산업 자동화 현장에서 약 3년을 보내고 AI로 넘어왔습니다.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
  :root{--ink:#1a1d21;--sub:#5b6168;--line:#d5d9dd;--acc:#1f5f63;--pre:#b8bec4}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e8ea;--sub:#9aa1a8;--line:#3a4046;--acc:#6fb7b4;--pre:#5a6168}}
  .ink{fill:var(--ink)} .sub{fill:var(--sub)} .acc{fill:var(--acc)}

  .hz{stroke:var(--line);stroke-width:1.5;stroke-dasharray:840;stroke-dashoffset:840;animation:draw 1.4s ease-out forwards}
  .sun{fill:var(--acc);transform:translateY(34px);opacity:0;animation:rise 1.6s .7s cubic-bezier(.2,.7,.2,1) forwards}
  .ray{stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;opacity:0;animation:fade .8s 2.1s forwards}
  .f1{opacity:0;animation:fade .9s 1.1s forwards}
  .f2{opacity:0;animation:fade .9s 1.6s forwards}
  .f3{opacity:0;animation:fade .9s 2.0s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{to{transform:translateY(0);opacity:1}}
  @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
</style>
<defs><clipPath id="above"><rect x="0" y="0" width="840" height="150"/></clipPath></defs>
<g clip-path="url(#above)"><circle class="sun" cx="760" cy="150" r="30"/></g>
<g class="ray"><line x1="760" y1="104" x2="760" y2="94"/><line x1="727" y1="117" x2="720" y2="110"/><line x1="793" y1="117" x2="800" y2="110"/></g>
<line class="hz" x1="0" y1="150" x2="840" y2="150"/>
<text class="ink f1" x="0" y="58" font-size="40" font-weight="700" letter-spacing="-0.5">sunlitsoil</text>
<text class="ink f2" x="0" y="100" font-size="16">산업 자동화 현장에서 약 3년을 보내고 AI로 넘어왔습니다.</text>
<text class="sub f3" x="0" y="126" font-size="16">AI에게 일을 맡기는 지금은 맡긴 결과가 맞는지 무엇으로 확인할지를 붙잡고 있습니다.</text>
</svg>
