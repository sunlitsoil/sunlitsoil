<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 150" width="840" height="150" role="img" aria-label="공정 도면 심볼 인식 파이프라인: 심볼 검출, 텍스트 짝짓기, 배관 연결, CAD 원본 추출. 운영 기본 엔진으로 채택.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
  :root{--ink:#1a1d21;--sub:#5b6168;--line:#d5d9dd;--acc:#1f5f63;--pre:#b8bec4}
  @media (prefers-color-scheme:dark){:root{--ink:#e6e8ea;--sub:#9aa1a8;--line:#3a4046;--acc:#6fb7b4;--pre:#5a6168}}
  .ink{fill:var(--ink)} .sub{fill:var(--sub)} .acc{fill:var(--acc)}
  @keyframes fade{to{opacity:1}}

  .track{stroke:var(--line);stroke-width:1.5;stroke-dasharray:720;stroke-dashoffset:720;animation:draw 1.2s ease-out forwards}
  .node{fill:var(--ink);opacity:0;animation:fade .4s forwards}
  .lab{opacity:0;animation:fade .5s forwards}
  .dot{fill:var(--acc);animation:run 5s 1.6s cubic-bezier(.45,0,.55,1) infinite;opacity:0}
  .end{opacity:0;animation:fade .6s 1.6s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes run{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(720px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  @media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<text class="sub" x="0" y="20" font-size="12">공정 도면 심볼 인식, 도면 한 장이 지나가는 순서</text>
<line class="track" x1="40" y1="70" x2="760" y2="70"/>
<circle class="node" style="animation-delay:0.0s" cx="40" cy="70" r="6"/>
<text class="ink lab" style="animation-delay:0.2s" x="40" y="100" font-size="14" font-weight="600" text-anchor="middle">심볼 검출</text>
<circle class="node" style="animation-delay:0.3s" cx="280" cy="70" r="6"/>
<text class="ink lab" style="animation-delay:0.5s" x="280" y="100" font-size="14" font-weight="600" text-anchor="middle">텍스트 짝짓기</text>
<circle class="node" style="animation-delay:0.6s" cx="520" cy="70" r="6"/>
<text class="ink lab" style="animation-delay:0.8s" x="520" y="100" font-size="14" font-weight="600" text-anchor="middle">배관 연결</text>
<circle class="node" style="animation-delay:0.9s" cx="760" cy="70" r="6"/>
<text class="ink lab" style="animation-delay:1.1s" x="760" y="100" font-size="14" font-weight="600" text-anchor="middle">CAD 원본 추출</text>
<circle class="dot" cx="40" cy="70" r="5"/>
<text class="acc end" x="0" y="136" font-size="13" font-weight="600">운영 기본 엔진으로 채택, 검출 모델 mAP50 0.986, 재현율 0.988(내부 검증셋)</text>
</svg>